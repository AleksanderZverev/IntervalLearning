worker_processes auto;

events { 
    worker_connections 1024; 
}

http {
	server {
		listen 80;

        server_name interval-learning.ru www.interval-learning.ru;

        location ~ ^/.well-known/acme-challenge/([a-zA-Z0-9-_]+)$ {
            return 301 https://validation.certificate-manager.api.cloud.yandex.net/fpq9fupu96fq8gnorsrl/$1;
        }
		
		location / {
			return 301 https://$host$request_uri;
		}
	}

    server {
        listen 443 ssl;

        server_name interval-learning.ru www.interval-learning.ru;

        ssl_certificate /etc/nginx/fullchain.pem;
        ssl_certificate_key /etc/nginx/privkey.pem;

        add_header Strict-Transport-Security "max-age=7776000; includeSubDomains" always;
        add_header Access-Control-Allow-Origin 'interval-learning.ru' always;
        add_header Access-Control-Max-Age 86400;
        add_header Access-Control-Allow-Credentials 'true';

        location / {
            proxy_pass http://client:3000;
        }

        location /api/ {
            proxy_pass http://backend:80/api/;

            proxy_http_version 1.1;
            proxy_set_header   Upgrade $http_upgrade;
            proxy_set_header   Connection keep-alive;
            proxy_set_header   Host $host;
            proxy_cache_bypass $http_upgrade;
            proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
        }
    }
}