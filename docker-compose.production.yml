version: '3.4'

services:
  postgres:
    image: postgres:13
    environment:
      POSTGRES_DB: "${POSTGRES_DB}"
      POSTGRES_USER: "${POSTGRES_USER}"
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD}"
      PGDATA: "/var/lib/postgresql/data/pgdata"
    volumes:
      - .:/var/lib/postgresql/data
    ports:
      - "5432:5432"

  backend:
    restart: on-failure
    depends_on: 
      - postgres
    image: cr.yandex/crphggso9r6t8kclldqf/intervallearningapi:test
    environment:
      DB_CONNECTION_STRING: "Host=postgres;Port=5432;Database=${POSTGRES_DB};User Id=${POSTGRES_USER};Password=${POSTGRES_PASSWORD};Include Error Detail=true;"
      ASPNETCORE_ENVIRONMENT: "Production"
      #PUBLIC
      #- ASPNETCORE_URLS=https://+:443;http://+:80
      #IN_DOCKER
      ASPNETCORE_URLS: "http://+:80"
    ports: #USE EXPOSE
      - "5249:80"
      - "7249:443"

  client:
    depends_on: 
      - postgres
    image: cr.yandex/crphggso9r6t8kclldqf/client:test
    ports:
      - "3000:3000"

  proxy:
    depends_on:
      - backend
      - client
    image: cr.yandex/crphggso9r6t8kclldqf/nginx:test
    ports:
      - "443:443"
      - "80:80"
